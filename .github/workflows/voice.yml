name: Generate Arabic Narration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/story.txt"
      - "scripts/generate.py"
      - ".github/workflows/voice.yml"

permissions:
  contents: read

concurrency:
  group: arabic-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # GitHub-hosted standard runners are CPU-only; Edge TTS does synthesis online.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          python -m pip check
          python -c "from importlib.metadata import version; print('edge-tts', version('edge-tts'))"

      - name: Validate source and generator
        run: |
          test -s scripts/story.txt
          python -m py_compile scripts/generate.py
          python - <<'PY'
          from pathlib import Path
          from scripts.generate import split_text, VOICE
          text = Path("scripts/story.txt").read_text(encoding="utf-8")
          chunks = split_text(text)
          assert chunks and all(0 < len(x) <= 2800 for x in chunks)
          assert "".join(chunks).replace(" ", "")  # non-empty normalized content
          assert VOICE == "ar-SA-HamedNeural"
          print(f"Text validation: OK ({len(chunks)} chunk(s)); voice={VOICE}")
          PY

      - name: Generate Arabic MP3
        run: |
          mkdir -p output
          python scripts/generate.py

      - name: Verify MP3
        run: |
          test -s output/narration.mp3
          ffprobe -v error -show_entries format=duration             -of default=noprint_wrappers=1:nokey=1 output/narration.mp3
          ls -lh output/narration.mp3

      - name: Upload generated audio
        uses: actions/upload-artifact@v4
        with:
          name: arabic-narration-mp3
          path: output/narration.mp3
          if-no-files-found: error
          retention-days: 7
